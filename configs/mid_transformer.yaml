# configs/mid_transformer.yaml
# Transformer-basierte Mid-Level Fusion.
# Nutzt den Audio-Zweig aus der Mid-Fusion, ersetzt die GRU-Fusion
# durch einen TransformerDecoder mit Cross-Attention (Audio=Query, Video=Memory).

experiment:
  name: mid_transformer
  fusion: mid_transformer

data:
  train_wav_txt: /app/data/dev_train_av_78.txt
  test_wav_txt:  /app/data/dev_test_78.txt
  eval_wav_txt:  /app/data/dev_test_78.txt
  feature_config: /app/configs/feature.json
  visual_features_dir: /app/data/visual_features
  video_fps: 29.97
  train_wav_length: 1.27
  batch_size:  128
  num_workers: 4

features:
  feature: amp_phasediff
  fft_size: 512
  stft_hop_size: 240

model:
  in_ch: 7
  class_num: 13
  n_tracks: 3
  vis_in: 444
  vis_emb: 256
  rnn_size: 128
  dropout: 0.05

training:
  epochs: 100
  optimizer: adam
  lr: 0.00005
  weight_decay: 0.000001
  lr_decay_step: 10000
  lr_decay_gamma: 0.5
  grad_clip_norm: 0.1
  accumulation_steps: 1
  device: cuda
  save_every: 1
  eval_every: 5
  random_seed: 0
  max_iter: 20000
  model_save_interval: 1000

validation:
  val: true
  eval: false
  val_wav_txt: /app/data/dev_test_78.txt
  eval_wav_txt:  /app/data/dev_test_78.txt
  eval_model: null
  threshold_config: /app/configs/threshold.json
  eval_wav_hop_length: 1.2
  sampling_frequency: 24000

paths:
  log_dir:        /app/results/logs/mid_transformer
  checkpoint_dir: /app/results/checkpoints/mid_transformer
